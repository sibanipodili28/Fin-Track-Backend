server:
  port: 8080
spring:
  application:
    name: fintrack
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fintrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  swagger-ui:
    path: /swagger-ui.html
